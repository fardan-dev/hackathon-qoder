name: claimshield

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-claims}:${POSTGRES_PASSWORD:-claims}@postgres:5432/${POSTGRES_DB:-claims}?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  REDIS_ADDR: redis:6379
  TENANT_ID: ${TENANT_ID:-018f0000-0000-7000-8000-000000000001}
  TENANT_SALT: ${TENANT_SALT:-change-me-tenant-salt}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me-internal-token}
  RULE_CATALOG_VERSION: "2026.11.1"
  ENGINE_VERSION: "rulesengine-1.0.0"
  KAFKA_TOPIC_SUFFIX: ${KAFKA_TOPIC_SUFFIX:-v1}
  DOC_FORENSICS_ENABLED: "false"
  LOG_LEVEL: info

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      POSTGRES_DB: ${POSTGRES_DB:-claims}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claims} -d ${POSTGRES_DB:-claims}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.tools
      args:
        TOOL: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-claims}:${POSTGRES_PASSWORD:-claims}@postgres:5432/${POSTGRES_DB:-claims}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: identity
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  ingestion:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ingestion
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
      IDENTITY_URL: http://identity:8080
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  rules:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: rules
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
      INGESTION_URL: http://ingestion:8080
      ALERT_URL: http://alert:8080
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  alert:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: alert
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  case:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: case
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  audit:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: audit
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  metering:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: metering
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  reporting:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: reporting
    environment:
      <<: *app-env
      HTTP_ADDR: :8080
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
